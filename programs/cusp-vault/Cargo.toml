[package]
name = "cusp-vault"
version = "0.1.0"
description = "Cusp Vault: deposit USDC, mint cUSDC shares, withdraw with yield"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "cusp_vault"

[dependencies]
borsh = { version = "1.5.3", features = ["derive"] }
solana-program = "1.18.26"
spl-token = { version = "4.0.3", features = ["no-entrypoint"] }
