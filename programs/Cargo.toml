[workspace]
members = [
    "cusp-vault",
    "cusp-leverage",
    "cusp-earn-vault",
    "cusp-outcome-escrow",
]
resolver = "2"

[profile.release]
overflow-checks = true
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
